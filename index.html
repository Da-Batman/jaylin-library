<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Jaylin's Hall</title>

<style>

/* =====================================================
   BASIC PAGE SETTINGS
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    background: #090605;
    color: #fff1cf;
    font-family: Georgia, "Times New Roman", serif;
}

/* =====================================================
   MAIN HALL

   The image itself is displayed here.
   The touch zones are positioned over the image.
===================================================== */

.hall-wrapper {
    display: flex;
    justify-content: center;
    align-items: flex-start;

    width: 100%;
    min-height: 100vh;

    background:
        radial-gradient(
            circle at center,
            #29140b,
            #080403
        );
}

.hall-scene {
    position: relative;

    width: 100%;
    max-width: 1536px;

    aspect-ratio: 3 / 2;

    overflow: hidden;

    background-color: #120906;
}

.hall-image {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: contain;

    user-select: none;
    -webkit-user-drag: none;
}

/* =====================================================
   INVISIBLE TOUCH ZONES

   These sit over the signs and objects already pictured.
===================================================== */

.touch-zone {
    position: absolute;

    border: 2px solid transparent;
    border-radius: 12px;

    background: transparent;

    cursor: pointer;

    z-index: 5;

    transition:
        border-color 0.2s ease,
        background-color 0.2s ease,
        box-shadow 0.2s ease,
        transform 0.2s ease;
}

/*
   The border appears when the mouse moves over a zone.
   This helps users discover what can be touched.
*/

.touch-zone:hover,
.touch-zone:focus-visible {
    border-color: #ffe18a;

    background-color: rgba(255, 218, 105, 0.12);

    box-shadow:
        0 0 14px rgba(255, 220, 110, 0.95),
        inset 0 0 13px rgba(255, 220, 110, 0.25);

    transform: scale(1.025);

    outline: none;
}

/* Brief label shown when hovering */

.touch-zone::after {
    content: attr(data-label);

    position: absolute;
    left: 50%;
    bottom: -34px;

    transform: translateX(-50%);

    display: none;

    min-width: max-content;

    padding: 6px 10px;

    border: 1px solid #e5bb5d;
    border-radius: 7px;

    background: rgba(25, 11, 5, 0.96);
    color: #ffe49a;

    font-family: Georgia, serif;
    font-size: 0.75rem;
    font-weight: bold;

    pointer-events: none;
}

.touch-zone:hover::after,
.touch-zone:focus-visible::after {
    display: block;
}

/* =====================================================
   TOUCH ZONE LOCATIONS

   Percentages allow the zones to follow the image
   when the screen changes size.
===================================================== */

/* Top banners */

.zone-currently-reading {
    top: 1.5%;
    left: 12%;
    width: 10%;
    height: 26%;
}

.zone-books-read {
    top: 1.5%;
    left: 22%;
    width: 10%;
    height: 26%;
}

.zone-audiobooks {
    top: 1.5%;
    left: 67%;
    width: 10%;
    height: 26%;
}

.zone-wishlist {
    top: 1.5%;
    left: 77%;
    width: 10%;
    height: 26%;
}

/* Right-side controls */

.zone-settings {
    top: 1.5%;
    right: 1%;
    width: 8%;
    height: 8%;
}

.zone-help {
    top: 10%;
    right: 1%;
    width: 8%;
    height: 8%;
}

.zone-visitors {
    top: 18%;
    right: 1%;
    width: 8%;
    height: 8%;
}

/* Left shelves */

.zone-to-be-read {
    top: 32%;
    left: 3%;
    width: 17%;
    height: 12%;
}

.zone-read {
    top: 49%;
    left: 3%;
    width: 17%;
    height: 12%;
}

/* Center and right shelves */

.zone-my-library {
    top: 42%;
    left: 62%;
    width: 15%;
    height: 9%;
}

.zone-recommendations {
    top: 53%;
    left: 62%;
    width: 16%;
    height: 10%;
}

/* Fireplace */

.zone-fireplace {
    top: 48%;
    left: 38%;
    width: 23%;
    height: 30%;

    border-radius: 45% 45% 10px 10px;
}

/* Dragon */

.zone-dragon {
    top: 61%;
    left: 68%;
    width: 17%;
    height: 25%;

    border-radius: 45%;
}

/* Doorway */

.zone-door {
    top: 35%;
    right: 4%;
    width: 13%;
    height: 38%;

    border-radius: 50% 50% 10px 10px;
}

/* Reading chair and Explore book */

.zone-reading-nook {
    bottom: 4%;
    left: 4%;
    width: 29%;
    height: 32%;
}

.zone-explore {
    bottom: 2%;
    left: 5%;
    width: 17%;
    height: 10%;
}

/* =====================================================
   POP-UP WINDOW
===================================================== */

.modal-background {
    position: fixed;
    inset: 0;

    display: none;
    align-items: center;
    justify-content: center;

    padding: 18px;

    background: rgba(5, 2, 1, 0.86);
    backdrop-filter: blur(5px);

    z-index: 100;
}

.modal-background.open {
    display: flex;
}

.modal {
    position: relative;

    width: min(850px, 96%);
    max-height: 90vh;

    overflow-y: auto;

    padding: 28px;

    border: 4px solid #b88632;
    border-radius: 20px;

    background:
        linear-gradient(
            145deg,
            #4c2815,
            #211008
        );

    box-shadow:
        0 0 40px rgba(255, 199, 82, 0.4);

    animation: openModal 0.25s ease;
}

@keyframes openModal {

    from {
        opacity: 0;
        transform: scale(0.92);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }

}

.close-button {
    position: absolute;
    top: 12px;
    right: 14px;

    width: 44px;
    height: 44px;

    border: 2px solid #ffd875;
    border-radius: 50%;

    background: #691329;
    color: white;

    font-size: 1.4rem;
    font-weight: bold;

    cursor: pointer;
}

.modal-title {
    margin: 0 50px 8px 0;

    color: #ffd875;
    font-size: clamp(1.7rem, 4vw, 2.5rem);
}

.modal-subtitle {
    margin-bottom: 22px;

    color: #e7cfa0;
}

/* =====================================================
   BOOK CARDS
===================================================== */

.book-grid {
    display: grid;
    gap: 15px;
}

.book-card {
    display: grid;
    grid-template-columns: 85px 1fr;
    gap: 16px;

    padding: 15px;

    border: 1px solid rgba(255, 216, 117, 0.5);
    border-radius: 13px;

    background: rgba(255, 244, 218, 0.07);
}

.book-cover {
    display: flex;
    align-items: center;
    justify-content: center;

    width: 85px;
    min-height: 120px;

    padding: 7px;

    border: 2px solid #d6a749;
    border-radius: 5px;

    background:
        linear-gradient(
            145deg,
            #86233b,
            #280a10
        );

    color: #ffe29a;

    text-align: center;
    font-size: 0.75rem;
    font-weight: bold;
}

.book-information h3 {
    margin: 0;

    color: #ffd875;
}

.book-author {
    margin: 5px 0 12px;

    color: #e5c897;
}

.book-details {
    line-height: 1.6;
}

.book-button {
    margin-top: 12px;
    padding: 8px 13px;

    border: 1px solid #ffd875;
    border-radius: 7px;

    background: #691329;
    color: white;

    font-family: Georgia, serif;

    cursor: pointer;
}

/* =====================================================
   EMPTY AND SPECIAL PANELS
===================================================== */

.special-panel {
    padding: 30px;

    border: 2px dashed rgba(255, 216, 117, 0.55);
    border-radius: 15px;

    text-align: center;
}

.special-icon {
    margin-bottom: 12px;

    font-size: 4.5rem;
}

.progress-track {
    width: 100%;
    height: 18px;

    margin: 18px 0;

    overflow: hidden;

    border: 1px solid #d0a24d;
    border-radius: 20px;

    background: #160a05;
}

.progress-fill {
    height: 100%;

    background:
        linear-gradient(
            90deg,
            #8f1835,
            #eebf45
        );

    border-radius: inherit;
}

/* =====================================================
   MOBILE SCREEN ADJUSTMENTS
===================================================== */

@media (max-width: 700px) {

    body {
        overflow-x: auto;
    }

    /*
       The scene keeps a minimum width on small phones.
       This lets Jaylin scroll around the room instead
       of shrinking every touch control too much.
    */

    .hall-wrapper {
        justify-content: flex-start;
    }

    .hall-scene {
        min-width: 900px;
        min-height: 600px;
    }

    .touch-zone::after {
        font-size: 0.68rem;
    }

    .modal {
        padding: 22px 18px;
    }

    .book-card {
        grid-template-columns: 65px 1fr;
    }

    .book-cover {
        width: 65px;
        min-height: 95px;
    }

}
/* =====================================================
   LIVING HALL EFFECTS
===================================================== */

/* ---------- FIREPLACE FLICKER ---------- */

.fire-flicker {
    position: absolute;

    left: 43.5%;
    top: 60%;

    width: 13%;
    height: 15%;

    border-radius: 50% 50% 20% 20%;

    background:
        radial-gradient(
            ellipse at center bottom,
            rgba(255, 240, 135, 0.85) 0%,
            rgba(255, 143, 35, 0.60) 30%,
            rgba(255, 62, 5, 0.25) 55%,
            transparent 75%
        );

    filter: blur(7px);

    mix-blend-mode: screen;

    pointer-events: none;

    z-index: 3;

    animation:
        fireFlicker 0.18s infinite alternate,
        fireGlow 2.2s infinite ease-in-out;
}

.fire-flicker::before,
.fire-flicker::after {
    content: "";

    position: absolute;
    bottom: 5%;

    width: 34%;
    height: 75%;

    border-radius: 50% 50% 35% 35%;

    background:
        linear-gradient(
            to top,
            rgba(255, 65, 0, 0.15),
            rgba(255, 191, 55, 0.6),
            rgba(255, 246, 170, 0.2),
            transparent
        );

    filter: blur(5px);

    transform-origin: bottom center;
}

.fire-flicker::before {
    left: 18%;

    animation:
        flameLeft 0.75s infinite alternate ease-in-out;
}

.fire-flicker::after {
    right: 18%;

    animation:
        flameRight 0.62s infinite alternate ease-in-out;
}

@keyframes fireFlicker {

    0% {
        opacity: 0.55;
        transform: scale(0.94, 0.91);
    }

    100% {
        opacity: 0.95;
        transform: scale(1.07, 1.10);
    }
}

@keyframes fireGlow {

    0%,
    100% {
        box-shadow:
            0 0 25px rgba(255, 105, 25, 0.3),
            0 0 55px rgba(255, 92, 10, 0.15);
    }

    50% {
        box-shadow:
            0 0 38px rgba(255, 162, 45, 0.55),
            0 0 78px rgba(255, 85, 10, 0.25);
    }
}

@keyframes flameLeft {

    from {
        transform:
            rotate(-7deg)
            scaleY(0.75);
    }

    to {
        transform:
            rotate(6deg)
            scaleY(1.12);
    }
}

@keyframes flameRight {

    from {
        transform:
            rotate(8deg)
            scaleY(1.08);
    }

    to {
        transform:
            rotate(-5deg)
            scaleY(0.72);
    }
}


/* ---------- DRAGON MOVEMENT ---------- */

/*
   This creates a subtle magical glow and breathing motion
   over the current dragon.

   Because the dragon is part of the JPG, the dragon pixels
   cannot move independently yet. This effect makes the
   dragon area appear more alive until we add a separate
   transparent dragon image.
*/

.dragon-life {
    position: absolute;

    left: 68%;
    top: 63%;

    width: 15%;
    height: 20%;

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse at center,
            rgba(255, 196, 72, 0.09),
            rgba(255, 91, 22, 0.05),
            transparent 70%
        );

    pointer-events: none;

    z-index: 4;

    animation:
        dragonBreathing 3.6s infinite ease-in-out,
        dragonGlow 2.7s infinite ease-in-out;
}

.dragon-life::after {
    content: "✨";

    position: absolute;
    top: 12%;
    right: 8%;

    color: #ffe79a;
    font-size: clamp(0.8rem, 1.4vw, 1.5rem);

    opacity: 0;

    animation:
        dragonSparkle 4.5s infinite ease-in-out;
}

@keyframes dragonBreathing {

    0%,
    100% {
        transform:
            translateY(0)
            scale(1);
    }

    50% {
        transform:
            translateY(-4px)
            scale(1.025);
    }
}

@keyframes dragonGlow {

    0%,
    100% {
        box-shadow:
            0 0 10px rgba(255, 174, 56, 0.08);
    }

    50% {
        box-shadow:
            0 0 25px rgba(255, 174, 56, 0.25);
    }
}

@keyframes dragonSparkle {

    0%,
    65%,
    100% {
        opacity: 0;
        transform:
            translate(0, 0)
            scale(0.5);
    }

    75% {
        opacity: 1;
        transform:
            translate(-8px, -10px)
            scale(1);
    }

    90% {
        opacity: 0;
        transform:
            translate(-18px, -25px)
            scale(0.7);
    }
}


/* ---------- TIME-OF-DAY WINDOWS ---------- */

.window-sky {
    position: absolute;

    top: 18%;
    left: 34%;

    width: 27%;
    height: 25%;

    pointer-events: none;

    z-index: 2;

    opacity: 0.72;

    transition:
        background 1.5s ease,
        box-shadow 1.5s ease,
        opacity 1.5s ease;
}

/* Morning sunrise */

.hall-scene.sunrise .window-sky {
    background:
        radial-gradient(
            circle at 50% 85%,
            rgba(255, 221, 131, 0.70),
            rgba(255, 136, 78, 0.38) 30%,
            rgba(113, 86, 160, 0.18) 60%,
            transparent 78%
        );

    box-shadow:
        0 0 55px rgba(255, 169, 84, 0.3);
}

/* Daytime */

.hall-scene.daytime .window-sky {
    background:
        radial-gradient(
            circle at 55% 30%,
            rgba(255, 249, 195, 0.35),
            rgba(93, 179, 255, 0.25) 40%,
            transparent 75%
        );

    box-shadow:
        0 0 50px rgba(134, 205, 255, 0.25);
}

/* Sunset and dusk */

.hall-scene.dusk .window-sky {
    background:
        linear-gradient(
            to bottom,
            rgba(71, 49, 132, 0.24),
            rgba(218, 78, 91, 0.30),
            rgba(255, 161, 73, 0.42),
            transparent
        );

    box-shadow:
        0 0 55px rgba(255, 91, 72, 0.25);
}

/* Nighttime */

.hall-scene.nighttime .window-sky {
    background:
        radial-gradient(
            circle at 68% 22%,
            rgba(245, 245, 211, 0.72) 0,
            rgba(245, 245, 211, 0.72) 3%,
            transparent 4%
        ),
        radial-gradient(
            circle at 25% 30%,
            rgba(255, 255, 220, 0.75) 0,
            rgba(255, 255, 220, 0.75) 1%,
            transparent 2%
        ),
        radial-gradient(
            circle at 45% 15%,
            rgba(255, 255, 220, 0.65) 0,
            rgba(255, 255, 220, 0.65) 1%,
            transparent 2%
        ),
        radial-gradient(
            circle at 80% 45%,
            rgba(255, 255, 220, 0.60) 0,
            rgba(255, 255, 220, 0.60) 1%,
            transparent 2%
        ),
        linear-gradient(
            to bottom,
            rgba(5, 18, 66, 0.45),
            rgba(28, 25, 78, 0.28),
            transparent
        );

    box-shadow:
        0 0 45px rgba(65, 103, 214, 0.25);
}


/* ---------- WHOLE-ROOM LIGHTING ---------- */

.room-lighting {
    position: absolute;
    inset: 0;

    pointer-events: none;

    z-index: 2;

    transition:
        background-color 1.5s ease,
        opacity 1.5s ease;
}

.hall-scene.sunrise .room-lighting {
    background:
        linear-gradient(
            to right,
            rgba(255, 129, 64, 0.06),
            transparent 55%
        );
}

.hall-scene.daytime .room-lighting {
    background:
        rgba(255, 241, 190, 0.025);
}

.hall-scene.dusk .room-lighting {
    background:
        linear-gradient(
            to bottom,
            rgba(89, 34, 92, 0.08),
            rgba(172, 66, 42, 0.06)
        );
}

.hall-scene.nighttime .room-lighting {
    background:
        rgba(1, 7, 32, 0.17);
}


/* ---------- TEST LABEL ---------- */

.time-label {
    position: absolute;
    left: 50%;
    bottom: 1.5%;

    transform: translateX(-50%);

    padding: 7px 13px;

    border: 1px solid rgba(255, 220, 138, 0.75);
    border-radius: 20px;

    background: rgba(20, 9, 4, 0.82);
    color: #ffe7a2;

    font-size: clamp(0.65rem, 1vw, 0.9rem);

    pointer-events: none;

    z-index: 7;
}


/* ---------- REDUCED MOTION ACCESSIBILITY ---------- */

@media (prefers-reduced-motion: reduce) {

    .fire-flicker,
    .fire-flicker::before,
    .fire-flicker::after,
    .dragon-life,
    .dragon-life::after {
        animation: none;
    }
}
</style>

</head>

/* =====================================================
   CREATE A BOOK CARD
===================================================== */

function createBookCard(book) {

    return `
        <article class="book-card">

            <div class="book-cover">
                ${book.title}
            </div>

            <div class="book-information">

                <h3>
                    ${book.title}
                </h3>

                <div class="book-author">
                    ${book.author}
                </div>

                <div class="book-details">

                    <strong>Format:</strong>
                    ${book.format}
                    <br>

                    <strong>Location or source:</strong>
                    ${book.source}
                    <br>

                    <strong>Status:</strong>
                    ${book.status}

                </div>

                <button
                    class="book-button"
                    type="button"
                    onclick="showTestMessage()"
                >
                    View Book
                </button>

            </div>

        </article>
    `;
}

/* =====================================================
   OPEN A BOOK SECTION
===================================================== */

function openLibrarySection(sectionName) {

    const details =
        sectionDetails[sectionName];

    const books =
        libraryData[sectionName] || [];

    document
        .getElementById("modalTitle")
        .textContent = details.title;

    document
        .getElementById("modalSubtitle")
        .textContent = details.subtitle;

    if (books.length === 0) {

        document
            .getElementById("modalContent")
            .innerHTML = `
                <div class="special-panel">

                    <div class="special-icon">
                        📚
                    </div>

                    <h3>
                        This shelf is waiting for books.
                    </h3>

                </div>
            `;

    } else {

        document
            .getElementById("modalContent")
            .innerHTML = `
                <div class="book-grid">

                    ${books
                        .map(createBookCard)
                        .join("")}

                </div>
            `;
    }

    openModal();
}

/* =====================================================
   OPEN AND CLOSE THE POP-UP
===================================================== */

function openModal() {

    document
        .getElementById("modalBackground")
        .classList.add("open");

    document.body.style.overflow = "hidden";
}

function closeModal() {

    document
        .getElementById("modalBackground")
        .classList.remove("open");

    document.body.style.overflow = "";
}

/* Close when clicking outside the panel */

document
    .getElementById("modalBackground")
    .addEventListener("click", function(event) {

        if (event.target === this) {
            closeModal();
        }

    });

/* Close by pressing Escape */

document.addEventListener("keydown", function(event) {

    if (event.key === "Escape") {
        closeModal();
    }

});
